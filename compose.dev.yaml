# Postgres de développement uniquement. La production est décrite à la phase infrastructure.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forge-dev-data:/var/lib/postgresql/data
volumes:
  forge-dev-data:
